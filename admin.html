<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanass — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-page">
  <h1 style="font-size:22px;margin-bottom:4px;">Yangi matn qo'shish</h1>
  <p style="color:var(--ink-soft);font-size:13px;margin-top:0 0 20px;">Bu panel faqat sizga ko'rinadi.</p>

  <div id="loginBox">
    <div class="field">
      <label>Admin parol</label>
      <input type="password" id="adminPass" placeholder="Parolni kiriting">
    </div>
    <button class="btn-primary" id="loginBtn">Kirish</button>
  </div>

  <form id="textForm" style="display:none;">
    <div class="field">
      <label>Sarlavha</label>
      <input type="text" id="fTitle" placeholder="Masalan: Kunlik salomlashuv" required>
    </div>

    <div class="field">
      <label>Daraja</label>
      <select id="fLevel">
        <option>A1</option><option>A2</option>
        <option selected>B1</option><option>B2</option>
        <option>C1</option>
      </select>
    </div>

    <div class="field">
      <label>Matn (arabcha)</label>
      <textarea id="fText" dir="rtl" rows="5" placeholder="بِسْمِ اللَّهِ..." required></textarea>
    </div>

    <div class="field">
      <label>Audio yo'li (ixtiyoriy)</label>
      <input type="text" id="fAudio" placeholder="audio/kunlik-salom.mp3">
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">
        Avval audio faylni GitHub'da <b>tanass/audio/</b> papkaga yuklang (Upload files),
        so'ng shu yerga fayl nomini yozing. Bo'sh qoldirsangiz audiosiz saqlanadi.
      </div>
    </div>

    <button type="submit" class="btn-primary">Saqlash</button>
  </form>

  <div id="resultBox" style="display:none;margin-top:20px;">
    <p style="font-weight:700;">✅ Saqlandi</p>
    <pre id="resultJson" style="background:var(--surface-sunken);padding:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;"></pre>
  </div>
</div>

<script src="js/firebase-config.js" defer></script>
<script src="js/admin.js" defer></script>
</body>
</html>
