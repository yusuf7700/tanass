<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanass — sozlamalar</title>
<meta name="theme-color" content="#FAF7F1">
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .settings-list { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 15px 16px;
    font-weight: 600; font-size: 15px;
  }
  .settings-row span.sub { display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
  .settings-row button { font-weight: 700; color: var(--accent-ink); }
</style>
</head>
<body>

<div class="screen">
  <div class="topbar"><div class="brand"><h1>Sozlamalar</h1></div></div>

  <div class="settings-list">
    <div class="settings-row" id="accountRow">
      <div>Yuklanmoqda...</div>
    </div>

    <div class="settings-row" id="installRow" style="display:none;">
      <div>Ilovani o'rnatish<span class="sub">Bosh ekranga qo'shib, tezroq oching</span></div>
      <button id="installBtn">O'rnatish</button>
    </div>

    <div class="settings-row">
      <div>Kesh tozalash<span class="sub">Sahifa eskirgan ko'rinsa shuni bosing</span></div>
      <button id="clearCacheBtn">Tozalash</button>
    </div>

    <div class="settings-row">
      <a href="https://t.me/yuuvsuf" target="_blank" style="display:flex;justify-content:space-between;width:100%;">
        <span>Fikr-mulohaza (Telegram)</span><span>→</span>
      </a>
    </div>

    <div class="settings-row">
      <a href="https://instagram.com/yunusovvyusuf" target="_blank" style="display:flex;justify-content:space-between;width:100%;">
        <span>Instagram</span><span>→</span>
      </a>
    </div>
  </div>
</div>

<nav class="bottom-nav">

<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/progress-store.js" defer></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

let deferredPrompt;
const installRow = document.getElementById('installRow');
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installRow.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installRow.style.display = 'none';
});

document.getElementById('clearCacheBtn').addEventListener('click', async () => {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map((k) => caches.delete(k)));
  }
  location.reload(true);
});

// ---------- Google bilan kirish ----------
(async () => {
  const accountRow = document.getElementById('accountRow');
  const a = await window.authReady;
  if (!a) {
    accountRow.innerHTML = '<div>Hisob<span class="sub">Ulanishda xatolik, keyinroq urinib ko\'ring</span></div>';
    return;
  }

  a.onAuthStateChanged(a.auth, (user) => {
    if (user) {
      accountRow.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;">
          ${user.photoURL ? `<img src="${user.photoURL}" style="width:36px;height:36px;border-radius:50%;">` : ''}
          <div>${user.displayName || user.email}<span class="sub">Progress barcha qurilmalarda sinxron</span></div>
        </div>
        <button id="signOutBtn">Chiqish</button>
      `;
      document.getElementById('signOutBtn').addEventListener('click', () => a.signOut(a.auth));
    } else {
      accountRow.innerHTML = `
        <div>Hisobga kirmagansiz<span class="sub">Progressni boshqa qurilmalarda ham ko'rish uchun kiring</span></div>
        <button id="signInBtn">Google</button>
      `;
      document.getElementById('signInBtn').addEventListener('click', async () => {
        try {
          await a.signInWithPopup(a.auth, a.provider);
        } catch (e) {
          console.error(e);
          if (e.code !== 'auth/popup-closed-by-user') alert("Kirishda xatolik: " + e.message);
        }
      });
    }
  });

  await syncProgressWithCloud();
})();
</script>
</body>
</html>
