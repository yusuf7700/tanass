<style>
  .settings-list { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 15px 16px;
    font-weight: 600; font-size: 15px;
  }
  .settings-row span.sub { display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
  .settings-row button { font-weight: 700; color: var(--accent-ink); }
</style>

<body>

<div class="screen">
  <div class="topbar"><div class="brand"><h1>Sozlamalar</h1></div></div>

  <div class="settings-list">
    <div class="settings-row" id="accountRow">
      <div>Yuklanmoqda...</div>
    </div>

    <div class="settings-row" id="installRow" style="display:none;">
      <div>Ilovani o'rnatish<span class="sub">Bosh ekranga qo'shib, tezroq oching</span></div>
      <button id="installBtn">O'rnatish</button>
    </div>

    <div class="settings-row">
      <div>Kesh tozalash<span class="sub">Sahifa eskirgan ko'rinsa shuni bosing</span></div>
      <button id="clearCacheBtn">Tozalash</button>
    </div>

    <div class="settings-row">
      <a href="https://t.me/yuuvsuf" target="_blank" style="display:flex;justify-content:space-between;width:100%;">
        <span>Fikr-mulohaza (Telegram)</span><span>→</span>
      </a>
    </div>
  </div>
</div>
