<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanass — o'qish</title>
<meta name="theme-color" content="#FAF7F1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="screen">
  <div class="reader-header">
    <a href="index.html" class="back-btn" id="backBtn" aria-label="Orqaga">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h2 id="readerTitle">Matn</h2>
    <button id="restartBtn" class="pill-btn" aria-label="Yodlashni qaytadan boshlash">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Qaytadan
    </button>
    <button id="soundBtn" class="pill-btn" aria-label="Xato signalini yoqish/o'chirish" style="padding:7px 9px;">
      <svg id="soundIconOn" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg id="soundIconOff" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
  </div>

  <div class="player" id="player">
    <div class="scrub" id="scrub"><div class="fill" id="scrubFill"></div></div>
    <div class="controls">
      <div class="group">
        <button id="rewindBtn" class="icon-btn labeled" aria-label="10 soniya orqaga">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>−10s</span>
        </button>
        <button id="playBtn" class="play-btn" aria-label="Ijro etish"></button>
        <button id="forwardBtn" class="icon-btn labeled" aria-label="10 soniya oldinga">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          <span>+10s</span>
        </button>
      </div>
      <div class="right-controls">
        <button id="loopBtn" class="icon-btn" aria-label="Qayta-qayta ijro etish">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <select id="speedSelect" class="speed-select">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>
  </div>

  <div class="arabic-text-wrap">
    <button id="visibilityBtn" class="pill-btn floating" aria-label="Matnni berkitish">
      <svg id="eyeIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="visibilityLabel">Berkitish</span>
    </button>
    <div class="arabic-text" id="arabicText"></div>
  </div>
</div>

<div class="mic-dock">
  <select id="langSelect" class="lang-select" title="Tanish lahjasi">
    <option value="ar-SA">🇸🇦 Saudiya lahjasi</option>
    <option value="ar-EG">🇪🇬 Misr lahjasi</option>
    <option value="ar-AE">🇦🇪 BAA lahjasi</option>
    <option value="ar-JO">🇯🇴 Iordaniya lahjasi</option>
    <option value="ar-MA">🇲🇦 Marokash lahjasi</option>
  </select>
  <div class="status" id="micStatus">Boshlash uchun mikrofonni bosing</div>
  <button class="mic-btn" id="micBtn" aria-label="Mikrofon">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
  </button>
</div>

<script src="js/firebase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/progress-store.js" defer></script>
<script src="js/reader.js" defer></script>
<script>
// index.html'dan kelgan bo'lsak, "orqaga" tugmasi brauzerning tabiiy
// orqaga qaytish (bfcache) imkoniyatidan foydalansin — bu sahifani
// qayta yuklamasdan, xotiradan bir zumda tiklaydi. Boshqa joydan
// (masalan Telegram havolasi) ochilgan bo'lsa, oddiy havola ishlaydi.
document.getElementById('backBtn').addEventListener('click', (e) => {
  if (history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) {
    e.preventDefault();
    history.back();
  }
});
</script>
</body>
</html>
